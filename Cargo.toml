[package]
name = "payments-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1"
csv = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
fastrand = "2.5.0"
proptest = "1.11.0"
